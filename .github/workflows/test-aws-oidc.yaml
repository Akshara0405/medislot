
name: Test GitHub OIDC Connection to AWS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test-aws-connection:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::084767318885:role/MediSlot-GitHubActions-DeployRole
          aws-region: ap-south-1
          role-session-name: MediSlotOIDCTest
          

      - name: Verify AWS connection
        run: |
          aws sts get-caller-identity
          echo "Expected AWS account: 084767318885"
