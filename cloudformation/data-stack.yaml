
AWSTemplateFormatVersion: '2010-09-09'
Description: MediSlot private RDS MySQL, DynamoDB state tables, S3 buckets, SSM runtime configuration and the booking event bus.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]

Resources:
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets across two AZs for MediSlot RDS.
      SubnetIds:
        - Fn::ImportValue: !Sub 'MediSlot-${Environment}-PrivateSubnet1Id'
        - Fn::ImportValue: !Sub 'MediSlot-${Environment}-PrivateSubnet2Id'
      Tags: [{Key: Project, Value: MediSlot}]

  MediSlotDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub 'medislot-${Environment}-mysql'
      Engine: mysql
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      StorageType: gp3
      StorageEncrypted: true
      PubliclyAccessible: false
      MultiAZ: false
      DBName: medislot
      MasterUsername: medislot_admin
      MasterUserPassword: !Sub '{{resolve:ssm-secure:/medislot/${Environment}/db/password}}'
      Port: 3306
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - Fn::ImportValue: !Sub 'MediSlot-${Environment}-DatabaseSecurityGroupId'
      # Milestone 7: 7 days of automated backups = point-in-time restore window for the DR drill.
      BackupRetentionPeriod: 7
      PreferredBackupWindow: '20:00-20:30'
      PreferredMaintenanceWindow: 'sun:21:00-sun:21:30'
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      Tags:
        - Key: Name
          Value: !Sub 'medislot-${Environment}-mysql'
        - Key: Project
          Value: MediSlot

  # Slots are partitioned by doctor: every read is "this doctor's slots for these dates".
  #   HASH  doctor_id  (S)  e.g. "7"
  #   RANGE slot_id    (S)  e.g. "7#30#2026-11-02T03:30:00Z"  (unchanged format, still unique per doctor)
  #   LSI_DoctorDate: doctor_id + local_date, so one Query returns any date range (no per-day GSI queries).
  # A key-schema change means a new table, and a custom-named table can only be replaced under a new name,
  # hence "DoctorSlots". Slots are rebuilt from MySQL by the materializer (the deploy job invokes it).
  SlotsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'MediSlot-${Environment}-DoctorSlots'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: doctor_id
          AttributeType: S
        - AttributeName: slot_id
          AttributeType: S
        - AttributeName: local_date
          AttributeType: S
      KeySchema:
        - AttributeName: doctor_id
          KeyType: HASH
        - AttributeName: slot_id
          KeyType: RANGE
      LocalSecondaryIndexes:
        - IndexName: LSI_DoctorDate
          KeySchema:
            - AttributeName: doctor_id
              KeyType: HASH
            - AttributeName: local_date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'MediSlot-${Environment}-Idempotency'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: idempotency_key
          AttributeType: S
      KeySchema:
        - AttributeName: idempotency_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  AuthTokensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'MediSlot-${Environment}-AuthTokens'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: token_key
          AttributeType: S
        - AttributeName: token_type
          AttributeType: S
      KeySchema:
        - AttributeName: token_key
          KeyType: HASH
        - AttributeName: token_type
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  WaitlistTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'MediSlot-${Environment}-Waitlist'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slot_id
          AttributeType: S
        - AttributeName: waitlist_entry
          AttributeType: S
        - AttributeName: patient_id
          AttributeType: S
        - AttributeName: joined_at
          AttributeType: S
      KeySchema:
        - AttributeName: slot_id
          KeyType: HASH
        - AttributeName: waitlist_entry
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI_PatientWaitlists
          KeySchema:
            - AttributeName: patient_id
              KeyType: HASH
            - AttributeName: joined_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  HoldOffersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'MediSlot-${Environment}-HoldOffers'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slot_id
          AttributeType: S
        - AttributeName: offer_id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: expires_at
          AttributeType: N
      KeySchema:
        - AttributeName: slot_id
          KeyType: HASH
        - AttributeName: offer_id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI_OfferExpiry
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: expires_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  NotificationLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'MediSlot-${Environment}-NotificationLog'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: dispatch_key
          AttributeType: S
      KeySchema:
        - AttributeName: dispatch_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  DoctorPhotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'medislot-${Environment}-doctor-photos-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'medislot-${Environment}-artifacts-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  DBHostParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/medislot/${Environment}/db/host'
      Type: String
      Value: !GetAtt MediSlotDatabase.Endpoint.Address
      Description: MediSlot RDS endpoint hostname.

  DBPortParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/medislot/${Environment}/db/port'
      Type: String
      Value: '3306'

  DBNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/medislot/${Environment}/db/name'
      Type: String
      Value: medislot

  DBUsernameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/medislot/${Environment}/db/username'
      Type: String
      Value: medislot_admin

  PasswordPolicyParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/medislot/${Environment}/auth/password-min-length'
      Type: String
      Value: '10'

  AccessTokenMinutesParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/medislot/${Environment}/auth/access-token-minutes'
      Type: String
      Value: '15'

  RefreshTokenDaysParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/medislot/${Environment}/auth/refresh-token-days'
      Type: String
      Value: '7'

  # ------------------------------------------------------------------ Milestone 5: booking engine
  # Refund windows. A tier applies when (appointment start - cancellation time) >= minHoursBefore; exactly AT a
  # cutoff the higher tier still applies. Edit in the SSM console to test (the Lambda re-reads within 60 s);
  # change it here to make it permanent (the next deploy writes this value back).
  RefundPolicyParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/medislot/${Environment}/booking/refund-policy'
      Type: String
      Description: MediSlot refund tiers (JSON). Invalid JSON pauses cancellations (fail closed) instead of refunding wrongly.
      Value: '{"version":"2026-11-v1","currency":"INR","tiers":[{"tier":"FULL","minHoursBefore":24,"refundPercent":100},{"tier":"PARTIAL","minHoursBefore":6,"refundPercent":50},{"tier":"LATE","minHoursBefore":0,"refundPercent":0}]}'

  BookingLimitsParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/medislot/${Environment}/booking/limits'
      Type: String
      Description: MediSlot patient booking limits and optimistic-concurrency retry settings (JSON).
      Value: '{"maxUpcomingPerPatient":3,"minLeadMinutes":0,"maxOccAttempts":10,"backoffBaseMs":15,"backoffCapMs":400}'

  WorkflowRulesParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/medislot/${Environment}/booking/workflow-rules'
      Type: String
      Description: Milestone 6 rules (JSON) - reschedule cutoff and limit, waitlist cap, hold minutes, reminders, no-show grace.
      Value: '{"rescheduleCutoffHours":6,"maxReschedules":2,"waitlistCap":5,"holdMinutes":15,"reminderHours":[24,2],"noShowGraceMinutes":60}'

  BookingEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub 'medislot-${Environment}-events'

  # Every booking event is kept 30 days and can be replayed into the bus (e.g. for a new consumer).
  BookingEventArchive:
    Type: AWS::Events::Archive
    Properties:
      ArchiveName: !Sub 'medislot-${Environment}-booking-archive'
      SourceArn: !GetAtt BookingEventBus.Arn
      RetentionDays: 30
      EventPattern:
        source: [medislot.booking]

  # Audit trail the mentor can read: every AppointmentBooked / AppointmentCancelled / SlotSeatFreed / SlotCancelled.
  BookingEventLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/events/medislot-${Environment}-booking'
      RetentionInDays: 30

  BookingEventLogPolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: !Sub 'medislot-${Environment}-eventbridge-to-logs'
      PolicyDocument: !Sub '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":["events.amazonaws.com","delivery.logs.amazonaws.com"]},"Action":["logs:CreateLogStream","logs:PutLogEvents"],"Resource":"${BookingEventLogGroup.Arn}"}]}'

  BookingEventLogRule:
    Type: AWS::Events::Rule
    DependsOn: BookingEventLogPolicy
    Properties:
      Name: !Sub 'medislot-${Environment}-booking-events-to-logs'
      Description: Copy every MediSlot booking event to CloudWatch Logs.
      EventBusName: !Ref BookingEventBus
      State: ENABLED
      EventPattern:
        source: [medislot.booking]
      Targets:
        - Id: BookingEventLog
          Arn: !GetAtt BookingEventLogGroup.Arn

Outputs:
  DBEndpoint:
    Value: !GetAtt MediSlotDatabase.Endpoint.Address
  DBName:
    Value: medislot
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  DoctorPhotosBucketName:
    Value: !Ref DoctorPhotosBucket
    Export:
      Name: !Sub 'MediSlot-${Environment}-DoctorPhotosBucketName'
  DoctorSlotsTableName:
    Value: !Ref SlotsTable
    Export:
      Name: !Sub 'MediSlot-${Environment}-DoctorSlotsTableName'
  # TRANSITION ONLY: the auth stack still imports this export until its next update, and CloudFormation refuses
  # to change or delete an export that is in use. Its value stays the old literal name so this update is allowed.
  # Remove this output once the auth stack has been deployed with the DoctorSlotsTableName import.
  SlotsTableName:
    Value: !Sub 'MediSlot-${Environment}-Slots'
    Export:
      Name: !Sub 'MediSlot-${Environment}-SlotsTableName'
  IdempotencyTableName:
    Value: !Ref IdempotencyTable
    Export:
      Name: !Sub 'MediSlot-${Environment}-IdempotencyTableName'
  BookingEventBusName:
    Value: !Ref BookingEventBus
    Export:
      Name: !Sub 'MediSlot-${Environment}-BookingEventBusName'
  BookingEventBusArn:
    Value: !GetAtt BookingEventBus.Arn
    Export:
      Name: !Sub 'MediSlot-${Environment}-BookingEventBusArn'
  BookingEventLogGroupName:
    Value: !Ref BookingEventLogGroup
  AuthTokensTableName:
    Value: !Ref AuthTokensTable
  WaitlistTableName:
    Value: !Ref WaitlistTable
  HoldOffersTableName:
    Value: !Ref HoldOffersTable
  NotificationLogTableName:
    Value: !Ref NotificationLogTable
    Export:
      Name: !Sub 'MediSlot-${Environment}-NotificationLogTableName'
  DatabaseInstanceId:
    Value: !Sub 'medislot-${Environment}-mysql'
    Export:
      Name: !Sub 'MediSlot-${Environment}-DatabaseInstanceId'
