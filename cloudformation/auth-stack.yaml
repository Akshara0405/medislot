  # (The BookingRetriesExhausted alarm moved to observability-stack.yaml with the other Milestone 7 alarms.)
  BookingDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub 'MediSlot-${Environment}-Booking'
      DashboardBody: !Sub |
        {"widgets":[
         {"type":"metric","x":0,"y":0,"width":12,"height":6,"properties":{"title":"BookingConflictRetries (Sum = retries, SampleCount = booking attempts)","region":"${AWS::Region}","stat":"Sum","period":60,"view":"timeSeries",
          "metrics":[["MediSlot/Booking","BookingConflictRetries","Environment","${Environment}",{"label":"conflict retries"}],["...",{"stat":"SampleCount","label":"booking attempts"}],["MediSlot/Booking","BookingRetriesExhausted","Environment","${Environment}",{"label":"gave up (503)"}]]}},
         {"type":"metric","x":12,"y":0,"width":12,"height":6,"properties":{"title":"Booking outcomes","region":"${AWS::Region}","stat":"Sum","period":60,"view":"timeSeries",
          "metrics":[["MediSlot/Booking","BookingsConfirmed","Environment","${Environment}",{"label":"booked (201)"}],["MediSlot/Booking","IdempotentReplays","Environment","${Environment}",{"label":"idempotent replays"}],[{"expression":"SEARCH('{MediSlot/Booking,Environment,Reason} MetricName=\"BookingsRejected\" Environment=\"${Environment}\"', 'Sum', 60)","id":"rej","label":"rejected"}]]}},
         {"type":"metric","x":0,"y":6,"width":12,"height":6,"properties":{"title":"CancellationsByTier","region":"${AWS::Region}","stat":"Sum","period":300,"view":"bar",
          "metrics":[[{"expression":"SEARCH('{MediSlot/Booking,Environment,Tier} MetricName=\"CancellationsByTier\" Environment=\"${Environment}\"', 'Sum', 300)","id":"tiers"}]]}},
         {"type":"metric","x":12,"y":6,"width":12,"height":6,"properties":{"title":"Refunded amount (INR) by tier, and event publish failures","region":"${AWS::Region}","stat":"Sum","period":300,"view":"timeSeries",
          "metrics":[[{"expression":"SEARCH('{MediSlot/Booking,Environment,Tier} MetricName=\"RefundAmount\" Environment=\"${Environment}\"', 'Sum', 300)","id":"amt"}],["MediSlot/Booking","EventPublishFailures","Environment","${Environment}"]]}},
         {"type":"log","x":0,"y":12,"width":24,"height":6,"properties":{"title":"Booking events on the bus (latest)","region":"${AWS::Region}","view":"table",
          "query":"SOURCE '/aws/events/medislot-${Environment}-booking' | fields @timestamp, `detail-type`, detail.appointmentId, detail.slotId, detail.refund.tier, detail.refund.refundAmount | sort @timestamp desc | limit 50"}}
        ]}
  DoctorInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DoctorFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/*/*'
  PatientInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PatientFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/*/*'
  AuthenticationInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthenticationFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/*/*'
  # A NEW logical id per change makes CloudFormation create a fresh deployment that includes the new routes
  # (Milestone 5 booking engine + shared doctor/patient slots endpoint, /doctor/me/schedule removed;
  #  then doctor appointment status + day cancellations for blackouts).
  ApiDeploymentMilestone6:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [BookingReschedulePostMethod, BookingRescheduleStatusGetMethod, BookingWaitlistsGetMethod, BookingWaitlistsPostMethod, BookingWaitlistDeleteMethod, BookingOfferAcceptPostMethod, BookingOfferDeclinePostMethod, BookingAppointmentsPostMethod, BookingAppointmentsGetMethod, BookingAppointmentItemGetMethod, BookingRefundQuoteGetMethod, BookingCancelPostMethod, BookingRefundsGetMethod, BookingDoctorAppointmentsGetMethod, BookingSlotCancellationsPostMethod, BookingDayCancellationsPostMethod, BookingAppointmentStatusPostMethod, PatientMePostMethod, PatientMePutMethod, PatientMeDeleteMethod, PatientProfileItemGetMethod, DirectorySearchGetMethod, DirectoryFiltersGetMethod, DirectoryDoctorGetMethod, DirectoryDoctorSlotsGetMethod, DoctorSlotBlocksPostMethod, HospitalsGetMethod, RegisterPatientMethod, RegisterDoctorMethod, LoginMethod, RefreshMethod, LogoutMethod, PatientMeMethod, DoctorMeMethod, DoctorMePutMethod, DoctorPhotoPostMethod, DoctorAvailabilityGetMethod, DoctorAvailabilityPutMethod, DoctorTypesGetMethod, DoctorTypesPostMethod, DoctorTypeItemPutMethod, DoctorTypeItemDeleteMethod, DoctorBlackoutsGetMethod, DoctorBlackoutsPostMethod, DoctorBlackoutItemDeleteMethod]
    Properties:
      RestApiId: !Ref RestApi
      Description: !Sub 'MediSlot ${Environment} API deployment - Milestone 6 reschedule, waitlists, hold offers'
  # One JSON line per API call (success or failure), with total latency, Lambda latency and authorizer latency.
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/medislot-${Environment}-access'
      RetentionInDays: 30
  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref RestApi
      DeploymentId: !Ref ApiDeploymentMilestone6
      StageName: !Ref Environment
      TracingEnabled: true
      AccessLogSetting:
        DestinationArn: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ApiAccessLogGroup}'
        Format: '{"requestId":"$context.requestId","time":"$context.requestTime","ip":"$context.identity.sourceIp","method":"$context.httpMethod","resource":"$context.resourcePath","path":"$context.path","status":"$context.status","latencyMs":"$context.responseLatency","lambdaLatencyMs":"$context.integration.latency","lambdaStatus":"$context.integration.status","authorizerStatus":"$context.authorizer.status","authorizerLatencyMs":"$context.authorizer.latency","userId":"$context.authorizer.userId","error":"$context.error.message"}'
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          MetricsEnabled: true
          LoggingLevel: INFO
          DataTraceEnabled: false
        # Public, unauthenticated discovery endpoints get their own tighter limits against scraping.
        - ResourcePath: '/~1doctors'
          HttpMethod: GET
          MetricsEnabled: true
          LoggingLevel: INFO
          DataTraceEnabled: false
          ThrottlingRateLimit: 25
          ThrottlingBurstLimit: 50
        # Booking: high enough for the 20+ parallel checkpoint test, low enough to blunt a runaway client.
        - ResourcePath: '/~1patient~1appointments'
          HttpMethod: POST
          MetricsEnabled: true
          LoggingLevel: INFO
          DataTraceEnabled: false
          ThrottlingRateLimit: 100
          ThrottlingBurstLimit: 200
        - ResourcePath: '/~1doctors~1{doctorId}~1slots'
          HttpMethod: GET
          MetricsEnabled: true
          LoggingLevel: INFO
          DataTraceEnabled: false
          ThrottlingRateLimit: 25
          ThrottlingBurstLimit: 50
Outputs:
