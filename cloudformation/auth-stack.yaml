  ApiDeploymentPatientDomain:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [PatientMePostMethod, PatientMePutMethod, PatientMeDeleteMethod, PatientProfileItemGetMethod, DirectorySearchGetMethod, DirectoryFiltersGetMethod, DirectoryDoctorGetMethod, DirectoryDoctorSlotsGetMethod, DoctorSlotBlocksPostMethod, HospitalsGetMethod, RegisterPatientMethod, RegisterDoctorMethod, LoginMethod, RefreshMethod, LogoutMethod, PatientMeMethod, DoctorMeMethod, DoctorMePutMethod, DoctorPhotoPostMethod, DoctorAvailabilityGetMethod, DoctorAvailabilityPutMethod, DoctorScheduleGetMethod, DoctorTypesGetMethod, DoctorTypesPostMethod, DoctorTypeItemPutMethod, DoctorTypeItemDeleteMethod, DoctorBlackoutsGetMethod, DoctorBlackoutsPostMethod, DoctorBlackoutItemDeleteMethod]
    Properties:
      RestApiId: !Ref RestApi
      Description: !Sub 'MediSlot ${Environment} API deployment - Milestone 4 patient domain and doctor discovery'
  # One JSON line per API call (success or failure), with total latency, Lambda latency and authorizer latency.
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/medislot-${Environment}-access'
      RetentionInDays: 30
  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref RestApi
      DeploymentId: !Ref ApiDeploymentPatientDomain
      StageName: !Ref Environment
      AccessLogSetting:
        DestinationArn: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ApiAccessLogGroup}'
        Format: '{"requestId":"$context.requestId","time":"$context.requestTime","ip":"$context.identity.sourceIp","method":"$context.httpMethod","resource":"$context.resourcePath","path":"$context.path","status":"$context.status","latencyMs":"$context.responseLatency","lambdaLatencyMs":"$context.integration.latency","lambdaStatus":"$context.integration.status","authorizerStatus":"$context.authorizer.status","authorizerLatencyMs":"$context.authorizer.latency","userId":"$context.authorizer.userId","error":"$context.error.message"}'
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          MetricsEnabled: true
          LoggingLevel: INFO
          DataTraceEnabled: false
        # Public, unauthenticated discovery endpoints get their own tighter limits against scraping.
        - ResourcePath: '/~1doctors'
          HttpMethod: GET
          MetricsEnabled: true
          LoggingLevel: INFO
          DataTraceEnabled: false
          ThrottlingRateLimit: 25
          ThrottlingBurstLimit: 50
        - ResourcePath: '/~1doctors~1{doctorId}~1slots'
          HttpMethod: GET
          MetricsEnabled: true
          LoggingLevel: INFO
          DataTraceEnabled: false
          ThrottlingRateLimit: 25
          ThrottlingBurstLimit: 50
