      Integration: {Type: AWS_PROXY, IntegrationHttpMethod: POST, Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DoctorFunction.Arn}/invocations'}
  # =================================================================== Milestone 5: booking engine
  BookingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'MediSlot-${Environment}-BookingRole'
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      ManagedPolicyArns: [!Ref LambdaExecutionBasePolicy]
      Policies:
        - PolicyName: BookingRuntimeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ssm:GetParameter]
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/*'
              - Effect: Allow
                Action: [kms:Decrypt]
                Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*'
                Condition: {StringEquals: {'kms:ViaService': !Sub 'ssm.${AWS::Region}.amazonaws.com'}}
              # Seats: read + conditional update only. No PutItem/DeleteItem: the booking engine can never
              # create or remove a slot, only take or give back a seat under a version check.
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:Query]
                Resource:
                  - !Sub
                    - 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SlotsTable}'
                    - SlotsTable: !ImportValue
                        Fn::Sub: 'MediSlot-${Environment}-DoctorSlotsTableName'
                  - !Sub
                    - 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SlotsTable}/index/*'
                    - SlotsTable: !ImportValue
                        Fn::Sub: 'MediSlot-${Environment}-DoctorSlotsTableName'
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem]
                Resource: !Sub
                  - 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${IdemTable}'
                  - IdemTable: !ImportValue
                      Fn::Sub: 'MediSlot-${Environment}-IdempotencyTableName'
              - Effect: Allow
                Action: [events:PutEvents]
                Resource: !ImportValue
                  Fn::Sub: 'MediSlot-${Environment}-BookingEventBusArn'
              # Milestone 6: waitlists, hold offers, reminder markers
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/MediSlot-${Environment}-Waitlist'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/MediSlot-${Environment}-HoldOffers'
              - Effect: Allow
                Action: [dynamodb:Query]
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/MediSlot-${Environment}-HoldOffers/index/GSI_OfferExpiry'
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:DeleteItem]
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/MediSlot-${Environment}-NotificationLog'
              # Milestone 6: the waitlist-promotions queue (SlotSeatFreed) triggers this function
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes, sqs:ChangeMessageVisibility]
                Resource: !Sub 'arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:medislot-${Environment}-waitlist-promotions'
  BookingLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/medislot-${Environment}-booking'
      RetentionInDays: 30
  BookingFunction:
    Type: AWS::Lambda::Function
    DependsOn: BookingLogGroup
    Properties:
      FunctionName: !Sub 'medislot-${Environment}-booking'
      Description: Booking engine (M5) + reschedule saga steps, waitlists, hold offers, reminders, no-show sweeper (M6).
      Runtime: python3.12
      Handler: lambda_function.handler
      TracingConfig: {Mode: Active}
      Role: !GetAtt BookingRole.Arn
      Timeout: 28
      MemorySize: 512
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Sub '${ArtifactPrefix}/booking.zip'}
      VpcConfig:
        SecurityGroupIds: [!ImportValue {Fn::Sub: 'MediSlot-${Environment}-LambdaSecurityGroupId'}]
        SubnetIds:
          - Fn::ImportValue: !Sub 'MediSlot-${Environment}-PrivateSubnet1Id'
          - Fn::ImportValue: !Sub 'MediSlot-${Environment}-PrivateSubnet2Id'
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          SLOTS_TABLE: !ImportValue
            Fn::Sub: 'MediSlot-${Environment}-DoctorSlotsTableName'
          IDEMPOTENCY_TABLE: !ImportValue
            Fn::Sub: 'MediSlot-${Environment}-IdempotencyTableName'
          EVENT_BUS_NAME: !ImportValue
            Fn::Sub: 'MediSlot-${Environment}-BookingEventBusName'
          WAITLIST_TABLE: !Sub 'MediSlot-${Environment}-Waitlist'
          HOLD_OFFERS_TABLE: !Sub 'MediSlot-${Environment}-HoldOffers'
          NOTIFICATION_LOG_TABLE: !Sub 'MediSlot-${Environment}-NotificationLog'
          FAULT_INJECTION: !Ref FaultInjection
  # Seat sweeper: gives back the seat of any cancellation whose in-request release did not finish.
  BookingSeatSweeperSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub 'medislot-${Environment}-booking-seat-sweeper'
      Description: Free seats of cancelled appointments that were not released (idempotent).
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - Id: BookingSeatSweeper
          Arn: !GetAtt BookingFunction.Arn
          Input: '{"action":"release-pending"}'
  BookingSeatSweeperPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BookingFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt BookingSeatSweeperSchedule.Arn
