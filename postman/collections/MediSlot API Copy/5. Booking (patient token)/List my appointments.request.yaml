$kind: http-request
url: "{{baseUrl}}/patient/appointments?view=upcoming&limit=20"
method: GET
queryParams:
  - key: view
    value: upcoming
    description: upcoming|past|cancelled|all
  - key: limit
    value: "20"
    description: 1..50
  - key: cursor
    value: ""
    disabled: true
auth:
  type: bearer
  credentials:
    token: "{{patientAccessToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
    language: text/javascript
order: 2000
