$kind: http-request
description: Your offered types plus the catalog (QUICK 15m, STANDARD 30m, DETAILED 60m, HEALTH_CAMP 60m cap 2-10).
url: "{{baseUrl}}/doctor/me/consultation-types"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{doctorAccessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      const j = pm.response.json();
      if (j.items && j.items.length) pm.collectionVariables.set('consultationTypeId', j.items[0].consultation_type_id);
    language: text/javascript
order: 4000
