$kind: http-request
description: Cancels every booking on the slot with full refunds. reason required (min 3 chars).
url: "{{baseUrl}}/doctor/me/slot-cancellations"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "slotId": "{{slotId}}",
      "reason": "Doctor unavailable due to emergency"
    }
auth:
  type: bearer
  credentials:
    token: "{{doctorAccessToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
    language: text/javascript
order: 17000
