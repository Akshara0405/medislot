$kind: http-request
url: "{{baseUrl}}/doctor/me/slot-blocks"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "slot_id": "{{slotId}}",
      "blocked": false
    }
auth:
  type: bearer
  credentials:
    token: "{{doctorAccessToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
    language: text/javascript
order: 15000
