$kind: http-request
description: slot_id from 'Get doctor slots' (format <doctorId>#<typeId>#<startUTC>). Existing bookings are kept.
url: "{{baseUrl}}/doctor/me/slot-blocks"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "slot_id": "{{slotId}}",
      "blocked": true
    }
auth:
  type: bearer
  credentials:
    token: "{{doctorAccessToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
    language: text/javascript
order: 14000
