$kind: http-request
description: Replaces the whole weekly pattern (max 100 rows). day_of_week Monday=0..Sunday=6, times HH:MM local. No overlaps on a day.
url: "{{baseUrl}}/doctor/me/availability"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "patterns": [
        {
          "day_of_week": 0,
          "consultation_type_id": "{{consultationTypeId}}",
          "start_time": "09:00",
          "end_time": "12:00"
        },
        {
          "day_of_week": 2,
          "consultation_type_id": "{{consultationTypeId}}",
          "start_time": "14:00",
          "end_time": "17:00"
        },
        {
          "day_of_week": 4,
          "consultation_type_id": "{{consultationTypeId}}",
          "start_time": "10:00",
          "end_time": "13:00"
        }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{doctorAccessToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
    language: text/javascript
order: 10000
