$kind: http-request
description: "DESTRUCTIVE: erases the profile and closes the account. Fails with 409 if there are upcoming appointments."
url: "{{baseUrl}}/patient/me"
method: DELETE
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "confirm": "DELETE",
      "refreshToken": "{{patientRefreshToken}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{patientAccessToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
    language: text/javascript
order: 3000
