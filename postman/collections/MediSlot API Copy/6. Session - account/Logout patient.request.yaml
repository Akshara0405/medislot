$kind: http-request
description: Denylists the access token and deletes the refresh token.
url: "{{baseUrl}}/auth/logout"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{patientRefreshToken}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{patientAccessToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
    language: text/javascript
order: 1000
