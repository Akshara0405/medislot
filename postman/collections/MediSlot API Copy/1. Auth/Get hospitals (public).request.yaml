$kind: http-request
description: Public list for the doctor sign-up dropdown.
url: "{{baseUrl}}/auth/hospitals"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      const j = pm.response.json();
      if (j.items && j.items.length) pm.collectionVariables.set('hospitalId', j.items[0].hospital_id);
    language: text/javascript
order: 1000
