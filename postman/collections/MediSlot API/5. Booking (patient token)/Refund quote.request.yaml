$kind: http-request
description: What a cancellation would refund right now.
url: "{{baseUrl}}/patient/appointments/{{appointmentId}}/refund-quote"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{patientAccessToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
    language: text/javascript
order: 4000
