$kind: http-request
description: "Group session: capacity 2-10."
url: "{{baseUrl}}/doctor/me/consultation-types"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "HEALTH_CAMP",
      "fee_amount": "200.00",
      "capacity": 5
    }
auth:
  type: bearer
  credentials:
    token: "{{doctorAccessToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 200/201/409', () => pm.expect(pm.response.code).to.be.oneOf([200, 201, 409]));
    language: text/javascript
order: 6000
