$kind: http-request
description: "Required: email, password (letter + digit, min length from SSM), firstName, lastName, phone. Optional: dateOfBirth, gender, address."
url: "{{baseUrl}}/auth/register/patient"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{patientEmail}}",
      "password": "{{patientPassword}}",
      "firstName": "Arjun",
      "lastName": "Kumar",
      "phone": "+919876543210",
      "dateOfBirth": "1995-06-15",
      "gender": "Male",
      "address": "Banjara Hills, Hyderabad"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is 201/409', () => pm.expect(pm.response.code).to.be.oneOf([201, 409]));
    language: text/javascript
order: 2000
