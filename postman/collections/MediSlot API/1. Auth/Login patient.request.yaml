$kind: http-request
description: Saves patientAccessToken / patientRefreshToken / patientId automatically.
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{patientEmail}}",
      "password": "{{patientPassword}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      if (j.accessToken) pm.collectionVariables.set('patientAccessToken', j.accessToken);
      if (j.refreshToken) pm.collectionVariables.set('patientRefreshToken', j.refreshToken);
      if (j.userId) pm.collectionVariables.set('patientId', j.userId);
    language: text/javascript
order: 4000
