$kind: http-request
description: Saves doctorAccessToken / doctorRefreshToken / doctorId automatically.
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{doctorEmail}}",
      "password": "{{doctorPassword}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      if (j.accessToken) pm.collectionVariables.set('doctorAccessToken', j.accessToken);
      if (j.refreshToken) pm.collectionVariables.set('doctorRefreshToken', j.refreshToken);
      if (j.userId) pm.collectionVariables.set('doctorId', j.userId);
    language: text/javascript
order: 5000
