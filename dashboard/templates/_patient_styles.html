<style>
/* Patient portal: same ink + teal family as the doctor workspace, with a warm coral/peach accent of its own. */
:root{--peach:#fff1ea;--peach-line:#ffd9c9;--coral-ink:#b4452c}
.pt-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-top:28px}
.pt-hero h1{font-size:clamp(30px,3.6vw,42px);margin:10px 0 6px}.pt-hero p{color:var(--muted);margin:0}
.eyebrow.warm{background:var(--peach);color:var(--coral-ink)}.eyebrow.warm .dot{background:var(--coral)}
.meter{min-width:230px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.meter b{font:800 15px Manrope,sans-serif}.meter small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.meter-bar{height:8px;border-radius:9px;background:#edf2f0;margin-top:9px;overflow:hidden}.meter-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--lime))}
.filter-card{background:var(--ink);color:#fff;border-radius:24px;padding:clamp(16px,2.4vw,26px);margin:18px 0}
.filter-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr auto;gap:12px;align-items:end}
.filter-grid label{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#b6c9c8;display:block;margin-bottom:7px}
.filter-grid input,.filter-grid select{width:100%;padding:12px 13px;border-radius:12px;border:1px solid #2c4757;background:#14384a;color:#fff;outline:none}
.filter-grid input::placeholder{color:#8fa9ad}.filter-grid select option{color:var(--ink)}
.filter-grid input:focus,.filter-grid select:focus{border-color:var(--lime)}
.btn-lime{background:var(--lime);color:var(--ink);border:0;border-radius:12px;padding:12px 20px;font-weight:800;cursor:pointer;white-space:nowrap}
.active-filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;font-size:12px}.active-filters a{background:rgba(255,255,255,.1);border-radius:20px;padding:6px 11px;color:#e8f3f1}.active-filters a:hover{background:rgba(255,255,255,.2)}
.result-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:6px 0 12px}
.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.doc-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;transition:transform .15s,box-shadow .15s}
.doc-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.doc-top{display:flex;gap:13px;align-items:center}.doc-top h3{margin:0;font-size:18px;letter-spacing:-.4px}.doc-top p{margin:3px 0 0;color:var(--muted);font-size:13px}
.doc-facts{display:flex;flex-wrap:wrap;gap:6px}.fact{font-size:12px;font-weight:700;border-radius:20px;padding:5px 10px;background:#f2f6f4;color:#385563}
.fact.fee{background:var(--peach);color:var(--coral-ink)}.fact.off{background:#f1f4f5;color:#7a878b}
.doc-card .primary{margin-top:auto}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px}
.pager .disabled{opacity:.4;pointer-events:none}
.empty-state{background:#fff;border:1.5px dashed #c9dad4;border-radius:22px;padding:34px;text-align:center;color:var(--muted)}
.empty-state h3{color:var(--ink);margin:0 0 6px}
.profile-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:4px 18px}
.profile-grid label{font-size:12px;font-weight:800;color:#385563}.req{color:var(--coral)}
.readonly{background:#f4f7f6!important;color:var(--muted)}
.danger-zone{border:1px solid #f1c9c0;background:#fffaf8;border-radius:22px;padding:clamp(16px,2.4vw,26px);margin:18px 0}
.danger-zone h3{margin:0 0 6px;color:#a43c2d}.danger-zone p{color:#8a5a4f;font-size:13px}
.danger-zone .inline{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.danger-zone input{max-width:180px;margin:0;padding:10px 12px;border:1px solid #f1c9c0;border-radius:10px;background:#fff}
/* Doctor profile + slot browser */
.doc-hero{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:26px;padding:clamp(18px,2.6vw,30px);margin-top:26px}
.doc-hero h1{font-size:clamp(28px,3vw,38px);margin:6px 0}.doc-hero .sub{color:var(--muted);margin:0}
.next-open{background:var(--mint);border-radius:18px;padding:14px 16px;min-width:200px}.next-open small{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#267a6c}.next-open b{display:block;font:800 18px Manrope,sans-serif;margin-top:4px}
.next-open.none{background:#f1f4f5}.next-open.none small{color:#6d7b80}
.type-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.type-card{border:1px solid var(--line);border-radius:18px;padding:15px;background:#fbfdfc}.type-card b{font:800 16px Manrope,sans-serif}.type-card .price{font:800 22px Manrope,sans-serif;color:var(--coral-ink);margin-top:6px}.type-card small{color:var(--muted)}
.slot-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.slot-tools form{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.slot-tools select{margin:0!important;width:auto!important}
.toggle{display:inline-flex;gap:7px;align-items:center;font-size:13px;font-weight:700;color:#385563}
.week-nav{display:flex;gap:8px;align-items:center}.week-nav .ghost{padding:9px 14px}.week-nav .disabled{opacity:.4;pointer-events:none}
.day-row{display:flex;gap:18px;padding:16px 0;border-top:1px solid var(--line)}
.day-tag{flex:0 0 92px}.day-tag b{display:block;font:800 17px Manrope,sans-serif}.day-tag small{color:var(--muted);font-size:12px}
.seat-grid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.seat-card{border-radius:16px;padding:12px 14px;border:1px solid #bfe8d8;background:var(--mint);color:#14594f;display:flex;flex-direction:column;gap:3px}
.seat-card .t{font:800 17px Manrope,sans-serif}.seat-card .k{font-size:12px;font-weight:700}.seat-card .s{font-size:12px;font-weight:800;margin-top:5px}
.seat-dots{display:flex;gap:3px;margin-top:4px}.seat-dots i{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.25}.seat-dots i.free{opacity:1}
.seat-card.full{background:#fff0ed;border-color:#f6cfc6;color:#a43c2d}
.day-note{flex:1;color:var(--muted);font-size:13px;align-self:center}.day-note.closed{color:#6d7b80}.day-note.full{color:#a43c2d;font-weight:700}
@media(max-width:900px){.filter-grid{grid-template-columns:1fr 1fr}.filter-grid .go{grid-column:1/-1}.doc-hero{grid-template-columns:auto 1fr}.next-open{grid-column:1/-1}}
@media(max-width:560px){.filter-grid{grid-template-columns:1fr}.day-row{flex-direction:column;gap:8px}.day-tag{flex:none}.doc-hero{grid-template-columns:1fr}}
</style>
